# Configuração do Lefthook
# Documentação: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    check-secrets:
      run: npx secretlint {staged_files}
    check-code:
      glob: "*.{js,ts,cjs,mjs,json}"
      exclude: "(^backend/|^frontend/)"
      stage_fixed: true
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
