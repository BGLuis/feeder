name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  root:
    name: root
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting and linting
        run: npx @biomejs/biome check .

      - name: Check i18n parity
        run: node scripts/check-i18n.mjs

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # The pipeline e2e spec needs a real MySQL: the regressions it guards come
    # from TypeORM query building and MySQL DDL rules, which mocks never hit.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpassword"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint:ci
        working-directory: backend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: backend

      - name: Run unit tests
        run: npm test
        working-directory: backend

      - name: Run e2e tests
        run: npm run test:e2e
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'

      - name: Build
        run: npm run build
        working-directory: backend

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run unit tests
        run: npm test -- --watch=false
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
